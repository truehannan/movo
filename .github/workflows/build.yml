name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for AT-SPI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Headless-friendly: install the SDK and test tools. PySide6 is not
          # needed for the logic tests (they never import Qt).
          pip install typesafe-sdk mss pynput pytest ruff

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Pytest
        run: pytest -q

  package:
    name: Build & validate .deb
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian

      - name: Build .deb
        run: bash packaging/build_deb.sh dist

      - name: Validate .deb
        run: bash packaging/validate_deb.sh dist/jev-desktop-agent_0.1.0_all.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-desktop-agent-deb
          path: dist/*.deb
          if-no-files-found: error
