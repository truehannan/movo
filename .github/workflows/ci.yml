name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  extension:
    name: Build & test extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build both targets
        run: |
          node scripts/build-extension.mjs chrome
          node scripts/build-extension.mjs firefox
      - name: Validate manifests
        run: |
          node -e "const m=require('./extension/dist/chromium/manifest.json'); if(m.manifest_version!==3||!m.side_panel) throw new Error('bad chromium manifest')"
          node -e "const m=require('./extension/dist/firefox/manifest.json'); if(m.manifest_version!==3||!m.sidebar_action) throw new Error('bad firefox manifest')"
      - name: Package
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          node scripts/package-chrome.mjs
          node scripts/package-firefox.mjs
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            dist/chrome/extension.zip
            dist/firefox/extension.xpi
          if-no-files-found: error
