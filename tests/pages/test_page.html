<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jev Agent Test Page</title>
  </head>
  <body>
    <!-- Deterministic controls for browser tests (PROMPT §36): buttons, links,
         text/password inputs, checkbox, radio, select, and a delayed/dynamic
         result region. Load this via file:// or a static server in CDP tests. -->
    <h1 id="heading">Test Page</h1>

    <form id="f" onsubmit="return false;">
      <label for="q">Search products</label>
      <input id="q" name="q" type="text" placeholder="Search products" />

      <label for="pw">Password</label>
      <input id="pw" name="pw" type="password" />

      <label><input id="agree" type="checkbox" /> Agree</label>
      <label><input name="plan" type="radio" value="basic" /> Basic</label>
      <label><input name="plan" type="radio" value="pro" /> Pro</label>

      <label for="country">Country</label>
      <select id="country">
        <option value="">Choose…</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
      </select>

      <button id="search" type="button" onclick="showResults()">Search</button>
      <button id="disabled" type="button" disabled>Disabled</button>
    </form>

    <a id="home" href="#home">Home</a>

    <div id="results"></div>

    <script>
      function showResults() {
        // Simulate delayed dynamic content.
        setTimeout(() => {
          const r = document.getElementById("results");
          r.innerHTML = '<a id="result0" href="#r0">First result</a>';
        }, 50);
      }
    </script>
  </body>
</html>
